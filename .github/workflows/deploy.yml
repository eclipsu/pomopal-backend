name: Deploy to EC2

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: production

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup SSH key
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.EC2_KEY }}" > ~/.ssh/key.pem
          chmod 600 ~/.ssh/key.pem
          ssh-keyscan -H ${{ secrets.EC2_HOST }} >> ~/.ssh/known_hosts

      - name: Deploy to EC2
        run: |
          ssh -i ~/.ssh/key.pem ${{ secrets.EC2_USER }}@${{ secrets.EC2_HOST }} << 'EOF'
            set -e
            cd ~/pomopal-backend
            git pull origin main
            export COMPOSE_BAKE=false
            docker compose down --remove-orphans
            docker rm -f nginx 2>/dev/null || true
            # Clear corrupt builder cache (snapshot parent not found on small disks)
            docker builder prune -af 2>/dev/null || true
            docker image prune -af 2>/dev/null || true
            docker compose build --no-cache --pull app
            docker compose up -d --remove-orphans
            sleep 8
            code=$(curl -s -o /dev/null -w "%{http_code}" http://127.0.0.1/user/profile || echo "000")
            if [ "$code" != "401" ] && [ "$code" != "403" ]; then
              echo "Health check failed (HTTP $code)"
              docker compose ps
              docker compose logs app --tail 80
              exit 1
            fi
            echo "Deploy OK (HTTP $code)"
          EOF

      - name: Notify Discord
        if: success()
        run: |
          curl -H "Content-Type: application/json" \
          -X POST \
          -d '{"content":"Pomopal API deployed successfully! 🚀"}' \
          ${{ secrets.DISCORD_WEBHOOK }}
